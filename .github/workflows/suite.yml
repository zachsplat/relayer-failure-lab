name: suite
# Runs the four scenarios against the pinned Relayer release (targets.json) on
# every push and pull request, and weekly against the pinned and the newest
# recorded release. A run fails when a scenario reaches no verdict or when its
# outcome differs from the one recorded in results/<version>.json.
on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: A version listed in targets.json (empty for the pinned default)
        default: ""
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: m
        env:
          TARGET: ${{ inputs.target }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          args=()
          [ -n "$TARGET" ] && args+=(--target "$TARGET")
          [ "$SCHEDULED" = true ] && args+=(--latest)
          python3 lab.py matrix "${args[@]}"
  scenario:
    needs: plan
    name: ${{ matrix.version }} / ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run scenario ${{ matrix.scenario }}
        env:
          VERSION: ${{ matrix.version }}
          IMAGE: ${{ matrix.image }}
          SCENARIO: ${{ matrix.scenario }}
        run: python3 lab.py run --version "$VERSION" --image "$IMAGE" --scenario "$SCENARIO" --out out --expect
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.version }}-${{ matrix.scenario }}
          path: |
            out/
            .work/*/logs/
            .work/*/config/config.json
          include-hidden-files: true
          if-no-files-found: warn
  report:
    needs: [plan, scenario]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Summary
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          for v in $(python3 -c 'import json,os; print(" ".join(sorted({i["version"] for i in json.loads(os.environ["MATRIX"])["include"]})))'); do
            img=$(python3 -c 'import json,os,sys; print(next(i["image"] for i in json.loads(os.environ["MATRIX"])["include"] if i["version"]==sys.argv[1]))' "$v")
            mkdir -p "/tmp/merge-$v" && cp -r artifacts/"$v"-*/out/. "/tmp/merge-$v"/ 2>/dev/null || true
            python3 lab.py merge --allow-partial --version "$v" --image "$img" "/tmp/merge-$v" >>"$GITHUB_STEP_SUMMARY" || true
            echo >>"$GITHUB_STEP_SUMMARY"
          done
  keepalive:
    # GitHub disables scheduled workflows in a repository with no activity for
    # 60 days, and results/ only changes on a Relayer release. The weekly run
    # records its date and outcome here, at most once every 28 days.
    needs: [scenario]
    if: github.event_name == 'schedule' && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: keepalive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the last verified run
        env:
          SUITE_RESULT: ${{ needs.scenario.result }}
        run: |
          set -euo pipefail
          f=results/last-verified.json
          if [ -f "$f" ] && python3 -I - "$f" <<'PY'
          import datetime, json, sys
          last = datetime.date.fromisoformat(json.load(open(sys.argv[1]))["date"])
          sys.exit(0 if (datetime.datetime.now(datetime.timezone.utc).date() - last).days < 28 else 1)
          PY
          then echo "recorded less than 28 days ago; nothing to do"; exit 0; fi
          python3 -I - "$f" <<'PY'
          import datetime, json, os, sys
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          doc = {"date": datetime.datetime.now(datetime.timezone.utc).date().isoformat(), "suite": os.environ["SUITE_RESULT"], "run": run}
          open(sys.argv[1], "w").write(json.dumps(doc, indent=1) + "\n")
          PY
          git config user.name "Zachary Alexander"
          git config user.email "86435089+zachsplat@users.noreply.github.com"
          git add "$f"
          git commit -q -m "Last verified run $(date -u +%F)"
          for _ in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
