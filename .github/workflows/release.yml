name: release
# Every six hours: look for OpenZeppelin Relayer releases with no results in
# results/, run the four scenarios on each one's published image (pinned by the
# digest Docker Hub reports for the tag), and commit results/<version>.json,
# the new entry in targets.json and the README table.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Run on this release tag even if results exist (for example v1.9.0)
        default: ""
permissions:
  contents: read
concurrency:
  group: release-results
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      found: ${{ steps.r.outputs.found }}
      versions: ${{ steps.r.outputs.versions }}
      matrix: ${{ steps.r.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: r
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.version }}
        run: python3 lab.py releases --force "$FORCE"
  scenario:
    needs: detect
    if: needs.detect.outputs.found == 'true'
    name: ${{ matrix.version }} / ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run scenario ${{ matrix.scenario }}
        env:
          VERSION: ${{ matrix.version }}
          IMAGE: ${{ matrix.image }}
          SCENARIO: ${{ matrix.scenario }}
        run: python3 lab.py run --version "$VERSION" --image "$IMAGE" --scenario "$SCENARIO" --out out || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.version }}-${{ matrix.scenario }}
          path: |
            out/
            .work/*/logs/
            .work/*/config/config.json
          include-hidden-files: true
          if-no-files-found: error
  publish:
    needs: [detect, scenario]
    if: needs.detect.outputs.found == 'true' && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Write results
        env:
          VERSIONS: ${{ needs.detect.outputs.versions }}
        run: |
          set -euo pipefail
          python3 -c 'import json,os; [print(v["version"], v["image"]) for v in json.loads(os.environ["VERSIONS"])]' >versions.txt
          while read -r v img; do
            mkdir -p "/tmp/merge-$v"
            cp -r artifacts/"$v"-*/out/. "/tmp/merge-$v"/
            python3 lab.py merge --add-target --version "$v" --image "$img" "/tmp/merge-$v" | tee -a "$GITHUB_STEP_SUMMARY"
          done <versions.txt
          rm versions.txt
          # never commit an error or inconclusive outcome: fail, and the next scheduled run retries
          python3 -I -c 'import glob,json,sys; bad=[" ".join((p, s, r["outcome"])) for p in glob.glob("results/v*.json") for s,r in json.load(open(p))["scenarios"].items() if r["outcome"] not in ("reproduces","fixed")]; print("\n".join(bad)); sys.exit(1 if bad else 0)'
          python3 lab.py table
      - name: Commit
        env:
          VERSIONS: ${{ needs.detect.outputs.versions }}
        run: |
          set -euo pipefail
          git config user.name "Zachary Alexander"
          git config user.email "86435089+zachsplat@users.noreply.github.com"
          git add results/ targets.json README.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          list=$(python3 -c 'import json,os; print(", ".join(v["version"] for v in json.loads(os.environ["VERSIONS"])))')
          git commit -q -m "Results for Relayer $list" -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for _ in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
